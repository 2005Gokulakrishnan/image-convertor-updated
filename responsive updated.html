<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HEIC / HEIF → JPG Converter</title>


  <!-- HEIC / HEIF Converter -->
  <script src="https://cdn.jsdelivr.net/npm/heic-to@1.5.2/dist/iife/heic-to.js"></script>


  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-soft: #eff6ff;
      --success: #15803d;
      --success-soft: #f0fdf4;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --surface: #ffffff;
      --background: #f8fafc;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --radius-lg: 20px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, #eff6ff 0, transparent 35%),
        var(--background);
    }

    .page {
      width: min(1100px, 100%);
      margin: 0 auto;
    }

    .hero {
      text-align: center;
      padding: clamp(28px, 6vw, 58px) 16px 28px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      margin-bottom: 14px;
      border: 1px solid #bfdbfe;
      border-radius: 999px;
      color: var(--primary-dark);
      background: rgba(239, 246, 255, 0.9);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary);
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.1;
      letter-spacing: -0.035em;
    }

    .subtitle {
      max-width: 650px;
      margin: 14px auto 0;
      color: var(--muted);
      font-size: clamp(14px, 2vw, 16px);
      line-height: 1.6;
    }

    .converter {
      padding: clamp(18px, 4vw, 32px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.88);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .upload-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 210px;
      padding: 28px 18px;
      border: 2px dashed #bfdbfe;
      border-radius: var(--radius-md);
      background: linear-gradient(180deg, #f8fbff 0%, #eff6ff 100%);
      text-align: center;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .upload-zone:hover {
      border-color: #60a5fa;
      background: #eff6ff;
    }

    .upload-icon {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      margin-bottom: 14px;
      border-radius: 16px;
      color: var(--primary);
      background: #dbeafe;
      font-size: 25px;
      font-weight: 800;
    }

    .upload-title {
      margin: 0;
      font-size: 17px;
      font-weight: 750;
    }

    .upload-help {
      margin: 7px 0 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    input[type="file"] {
      width: 100%;
      max-width: 430px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
    }

    input[type="file"]::file-selector-button {
      margin-right: 10px;
      padding: 9px 13px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: var(--primary);
      font-weight: 700;
      cursor: pointer;
    }

    input[type="file"]::file-selector-button:hover {
      background: var(--primary-dark);
    }

    .actions {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    button {
      min-height: 46px;
      padding: 11px 22px;
      border: 0;
      border-radius: 11px;
      color: #fff;
      background: var(--primary);
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.22);
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.28);
    }

    button:active {
      transform: translateY(0);
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.22);
      outline-offset: 2px;
    }

    #status {
      min-height: 24px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
      margin-top: 24px;
    }

    .card {
      min-width: 0;
      min-height: 300px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: 0 5px 18px rgba(15, 23, 42, 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .card img {
      display: block;
      width: 100%;
      max-width: 190px;
      height: 190px;
      object-fit: contain;
      margin-bottom: 12px;
      border-radius: 10px;
      background: #f8fafc;
    }

    .file-name {
      width: 100%;
      margin: 5px 0;
      color: var(--text);
      font-size: 13px;
      font-weight: 650;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .success {
      margin: 6px 0;
      padding: 5px 9px;
      border-radius: 999px;
      color: var(--success);
      background: var(--success-soft);
      font-size: 12px;
      font-weight: 700;
    }

    .error {
      max-width: 100%;
      margin: 5px 0;
      padding: 7px 9px;
      border-radius: 8px;
      color: var(--danger);
      background: var(--danger-soft);
      font-size: 12px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .download {
      width: 100%;
      max-width: 190px;
      margin-top: 8px;
      text-decoration: none;
    }

    .download button {
      width: 100%;
      box-shadow: none;
      background: #0f172a;
    }

    .download button:hover {
      background: #1e293b;
    }

    @media (max-width: 700px) {
      body {
        padding: 14px;
      }

      .hero {
        padding: 22px 6px 20px;
      }

      .converter {
        padding: 14px;
        border-radius: 16px;
      }

      .upload-zone {
        min-height: 190px;
        padding: 22px 12px;
      }

      .container {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .card {
        min-height: 0;
        padding: 16px;
      }

      .card img {
        width: min(100%, 240px);
        height: 210px;
      }

      .download {
        max-width: 240px;
      }

      button {
        width: 100%;
      }
    }

    @media (max-width: 420px) {
      body {
        padding: 10px;
      }

      .badge {
        font-size: 10px;
      }

      h1 {
        font-size: 27px;
      }

      .subtitle {
        font-size: 13px;
      }

      input[type="file"] {
        font-size: 12px;
      }

      input[type="file"]::file-selector-button {
        margin-right: 6px;
        padding: 8px 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>

</head>


<body>


  <h1>
    HEIC / HEIF → JPG Converter
  </h1>


  <!-- File Selection -->

  <input
    type="file"
    id="upload"
    multiple
    accept=".heic,.heif,image/heic,image/heif"
  >


  <br>


  <!-- Convert Button -->

  <button id="convertBtn">
    Convert All
  </button>


  <!-- Status -->

  <div id="status"></div>


  <!-- Converted Images -->

  <div
    class="container"
    id="output"
  ></div>



  <script>


    /*
     * Convert all selected HEIC / HEIF files
     */

    async function convertImages() {


      const upload =
        document.getElementById("upload");


      const output =
        document.getElementById("output");


      const status =
        document.getElementById("status");


      const files =
        upload.files;


      /*
       * Check whether files are selected
       */

      if (!files.length) {

        alert(
          "Please select HEIC / HEIF images."
        );

        return;

      }


      /*
       * Clear previous results
       */

      output.innerHTML = "";


      status.textContent =
        `Starting conversion of ${files.length} image(s)...`;


      /*
       * Process every file
       */

      for (
        let i = 0;
        i < files.length;
        i++
      ) {


        const file =
          files[i];


        /*
         * Create card
         */

        const card =
          document.createElement("div");


        card.className =
          "card";


        card.innerHTML = `

          <p class="file-name">
            ${escapeHTML(file.name)}
          </p>

          <p>
            Converting...
          </p>

        `;


        output.appendChild(card);


        try {


          /*
           * Check whether the file
           * is actually HEIC / HEIF
           */

          const isHeic =
            await HeicTo.isHeic(file);


          if (!isHeic) {

            throw new Error(
              "This file is not a valid HEIC / HEIF image."
            );

          }


          /*
           * Convert HEIC → JPEG
           */

          const jpegBlob =
            await HeicTo({

              blob: file,

              type: "image/jpeg",

              quality: 0.95

            });


          /*
           * Create preview URL
           */

          const imageURL =
            URL.createObjectURL(jpegBlob);


          /*
           * Create JPG filename
           */

          const jpgName =
            file.name
              .replace(/\.(heic|heif)$/i, "")
              + ".jpg";


          /*
           * Show converted image
           */

          card.innerHTML = `

            <img
              src="${imageURL}"
              alt="Converted JPG"
            >

            <p class="file-name">
              ${escapeHTML(jpgName)}
            </p>

            <p class="success">
              ✓ Converted successfully
            </p>

            <a
              class="download"
              href="${imageURL}"
              download="${escapeHTML(jpgName)}"
            >

              <button type="button">
                Download JPG
              </button>

            </a>

          `;


        }


        catch (error) {


          console.error(
            "Conversion error:",
            error
          );


          /*
           * Show actual error
           */

          card.innerHTML = `

            <p class="file-name">
              ${escapeHTML(file.name)}
            </p>

            <p class="error">
              ⚠️ Conversion failed
            </p>

            <p class="error">
              ${escapeHTML(
                error?.message ||
                String(error)
              )}
            </p>

          `;

        }


        /*
         * Update progress
         */

        status.textContent =
          `Converted ${i + 1} of ${files.length} image(s)...`;

      }


      /*
       * Finished
       */

      status.textContent =
        `Finished: ${files.length} file(s) processed.`;

    }



    /*
     * Protect HTML from file names
     */

    function escapeHTML(text) {

      return text

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

    }



    /*
     * Button click
     */

    document
      .getElementById("convertBtn")
      .addEventListener(
        "click",
        convertImages
      );


  </script>


</body>

</html>
